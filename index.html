<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginalia — a journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE8E0;
    --ink: #1C1B1E;
    --plum: #5B3A73;
    --plum-dim: #7c5a9c;
    --muted: #8A8792;
    --hairline: #D9D2C7;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Newsreader', serif;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a{ color: inherit; }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Masthead ---------- */
  header.masthead{
    padding: 72px 0 40px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 8px;
  }
  header.masthead .wrap{ display:flex; flex-direction:column; gap: 10px; }

  .site-title{
    font-family:'Courier Prime', monospace;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin:0;
    display:flex;
    align-items:baseline;
    gap: 2px;
  }
  .site-title .cursor{
    display:inline-block;
    width: 10px;
    height: 22px;
    background: var(--plum);
    margin-left: 4px;
    animation: blink 1.1s steps(1) infinite;
    transform: translateY(3px);
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .site-sub{
    font-size: 16px;
    color: var(--muted);
    font-style: italic;
    margin: 0;
  }

  /* ---------- List view ---------- */
  main{ padding: 8px 0 120px; }

  .entry{
    display:block;
    text-decoration:none;
    padding: 34px 0;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
  }
  .entry:first-child{ padding-top: 30px; }

  .entry-meta{
    display:flex;
    align-items:center;
    gap: 9px;
    font-family:'Courier Prime', monospace;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .mark{
    width: 9px;
    height: 9px;
    background: var(--plum);
    display:inline-block;
    flex-shrink:0;
  }

  .entry-title{
    font-size: 26px;
    line-height: 1.28;
    font-weight: 500;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .entry-excerpt{
    font-size: 17px;
    line-height: 1.6;
    color: #4b4a4e;
    margin: 0;
    max-width: 56ch;
  }

  .entry-readmore{
    display:inline-block;
    margin-top: 14px;
    font-family:'Courier Prime', monospace;
    font-size: 13px;
    color: var(--plum);
    position: relative;
  }
  .entry-readmore::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-3px;
    height:1px;
    background: var(--plum-dim);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .3s ease;
  }
  .entry:hover .entry-readmore::after{ transform: scaleX(1); }

  footer{
    padding: 40px 0 80px;
    text-align:center;
    font-family:'Courier Prime', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  /* ---------- Reading view ---------- */
  .reader{
    position: fixed;
    inset: 0;
    background: var(--paper);
    overflow-y: auto;
    transform: translateY(16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .42s cubic-bezier(.22,.61,.36,1), transform .42s cubic-bezier(.22,.61,.36,1);
    z-index: 10;
  }
  .reader.open{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .reader.paging .reader-body{
    animation: pageshift .38s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes pageshift{
    0%{ opacity:0; transform: translateX(14px); }
    100%{ opacity:1; transform: translateX(0); }
  }

  .reader-top{
    position: sticky;
    top: 0;
    background: var(--paper);
    border-bottom: 1px solid var(--hairline);
    z-index: 2;
  }
  .reader-top .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 22px 24px;
  }
  .close-btn{
    font-family:'Courier Prime', monospace;
    font-size: 13px;
    background: none;
    border: 1px solid var(--hairline);
    padding: 7px 14px;
    cursor: pointer;
    color: var(--ink);
    border-radius: 2px;
  }
  .close-btn:hover{ border-color: var(--plum-dim); color: var(--plum); }
  .close-btn:focus-visible, .entry:focus-visible, .nav-btn:focus-visible{
    outline: 2px solid var(--plum);
    outline-offset: 2px;
  }

  .progress{
    font-family:'Courier Prime', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .reader-body{ padding: 56px 0 40px; }

  .reader-body .entry-meta{ margin-bottom: 18px; }
  .reader-title{
    font-family:'Newsreader', serif;
    font-size: 40px;
    line-height: 1.18;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0 0 34px;
  }

  .reader-content p{
    font-size: 19px;
    line-height: 1.75;
    color: #302f33;
    margin: 0 0 24px;
    max-width: 60ch;
  }
  .reader-content p:first-of-type::first-letter{
    font-family:'Courier Prime', monospace;
    font-size: 46px;
    font-weight: 700;
    color: var(--plum);
    float: left;
    line-height: 0.8;
    padding-right: 8px;
    padding-top: 6px;
  }

  .reader-content figure{
    margin: 36px 0;
    max-width: 60ch;
  }
  .reader-content img{
    width: 100%;
    display: block;
    border: 1px solid var(--hairline);
  }
  .reader-content figcaption{
    font-family:'Courier Prime', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    padding-left: 12px;
    border-left: 2px solid var(--plum);
  }

  .entry-thumb{
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border: 1px solid var(--hairline);
    margin-bottom: 18px;
    display: block;
  }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:stretch;
    margin-top: 56px;
    border-top: 1px solid var(--hairline);
    padding-top: 28px;
    gap: 20px;
  }
  .nav-btn{
    flex: 1;
    text-align: left;
    background:none;
    border:none;
    cursor:pointer;
    padding: 4px 0;
    font-family: inherit;
    color: var(--ink);
  }
  .nav-btn.next{ text-align:right; }
  .nav-btn:disabled{ opacity: 0.25; cursor: default; }
  .nav-label{
    display:block;
    font-family:'Courier Prime', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .nav-title{
    display:block;
    font-size: 17px;
  }
  .nav-btn:hover:not(:disabled) .nav-title{ color: var(--plum); }

  @media (max-width: 560px){
    .entry-title{ font-size: 22px; }
    .reader-title{ font-size: 30px; }
    .reader-content p{ font-size: 17px; }
    header.masthead{ padding: 48px 0 28px; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="site-title">Marginalia<span class="cursor" aria-hidden="true"></span></p>
    <p class="site-sub">Notes, kept in a document, published the moment a new one begins.</p>
  </div>
</header>

<main>
  <div class="wrap" id="list"></div>
</main>

<footer>fed from a single Google Doc — new purple heading, new entry</footer>

<div class="reader" id="reader" role="dialog" aria-modal="true">
  <div class="reader-top">
    <div class="wrap">
      <button class="close-btn" id="closeBtn">← all entries</button>
      <span class="progress" id="progress"></span>
    </div>
  </div>
  <div class="wrap reader-body" id="readerBody"></div>
</div>

<script>
  // ------------------------------------------------------------------
  // CONFIG: paste your deployed Apps Script Web App URL here once you
  // have it (see doc-to-blog.gs). Leave blank to keep showing the
  // sample entries below.
  // ------------------------------------------------------------------
  const SCRIPT_URL = "";

  const posts = [
    {
      date: "September 12, 2026",
      title: "On writing somewhere no one is watching",
      excerpt: "There's a particular kind of sentence that only shows up when you've forgotten anyone might read it.",
      content: [
        { type: "text", value: "There's a particular kind of sentence that only shows up when you've forgotten anyone might read it. It arrives sideways, usually in the middle of a paragraph about something else entirely, and it says the actual thing." },
        { type: "text", value: "Most of what I write for an audience is a rehearsal of what I already believe. Most of what I write for no one is a discovery of what I didn't know I believed. The difference isn't quality. It's permission." },
        { type: "image", url: "https://images.unsplash.com/photo-1455390582262-044cdead277a?w=1200&q=80", caption: "the desk, most mornings, before it's tidied for anyone else" },
        { type: "text", value: "I've started keeping this document open the way some people keep a window cracked in winter — not because I need the cold air constantly, but because I want the option of it." }
      ]
    },
    {
      date: "September 5, 2026",
      title: "The unread pile as a kind of honesty",
      excerpt: "Every book on the nightstand is a small, ongoing confession about who I meant to become this year.",
      content: [
        { type: "text", value: "Every book on the nightstand is a small, ongoing confession about who I meant to become this year. Some of them I'll get to. Most of them are just proof I was paying attention to my own aspirations, briefly, at a bookstore." },
        { type: "text", value: "I used to feel guilty about this. Now I think the pile is doing its job even unread — it's a record of interest, which is its own kind of fidelity." },
        { type: "text", value: "The books I actually finish are rarely the ones I was proudest to buy." }
      ]
    },
    {
      date: "August 27, 2026",
      title: "A short defense of the boring walk",
      excerpt: "Not the walk you take to see something. The one you take to see nothing in particular, on purpose.",
      content: [
        { type: "text", value: "Not the walk you take to see something. The one you take to see nothing in particular, on purpose, down the same three streets you've walked forty times." },
        { type: "image", url: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&q=80", caption: "the second lap, same block" },
        { type: "text", value: "There's a theory that novelty is what makes a walk worthwhile — new street, new view, new thought. I don't think that's been true for me. The boring walk is where the actual thinking happens, precisely because nothing is asking for my attention." },
        { type: "text", value: "I've solved more real problems on the second lap around the same block than I have on any hike with a view." }
      ]
    },
    {
      date: "August 19, 2026",
      title: "What a draft is actually for",
      excerpt: "A first draft isn't a bad version of the finished thing. It's a different object with a different job.",
      content: [
        { type: "text", value: "A first draft isn't a bad version of the finished thing. It's a different object with a different job: finding out whether the idea survives being written down at all." },
        { type: "text", value: "I think this is why purple ended up meaning something to me here — a small, private flag for the moment an idea clears that first bar. Not good yet. Just real enough to keep." }
      ]
    }
  ];

  function leadImage(post){
    const img = post.content.find(b => b.type === 'image');
    return img ? img.url : null;
  }

  function renderContent(content){
    return content.map(block => {
      if(block.type === 'image'){
        return `<figure>
          <img src="${block.url}" alt="${block.caption || ''}" loading="lazy">
          ${block.caption ? `<figcaption>${block.caption}</figcaption>` : ''}
        </figure>`;
      }
      return `<p>${block.value}</p>`;
    }).join('');
  }

  const listEl = document.getElementById('list');
  const readerEl = document.getElementById('reader');
  const readerBody = document.getElementById('readerBody');
  const closeBtn = document.getElementById('closeBtn');
  const progressEl = document.getElementById('progress');

  let currentIndex = null;

  function renderList(){
    listEl.innerHTML = posts.map((p, i) => {
      const thumb = leadImage(p);
      return `
      <article class="entry" data-index="${i}" tabindex="0" role="button" aria-label="Open entry: ${p.title}">
        ${thumb ? `<img class="entry-thumb" src="${thumb}" alt="" loading="lazy">` : ''}
        <div class="entry-meta"><span class="mark" aria-hidden="true"></span>${p.date}</div>
        <h2 class="entry-title">${p.title}</h2>
        <p class="entry-excerpt">${p.excerpt}</p>
        <span class="entry-readmore">read this entry</span>
      </article>
    `;
    }).join('');

    listEl.querySelectorAll('.entry').forEach(el => {
      el.addEventListener('click', () => openPost(parseInt(el.dataset.index)));
      el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPost(parseInt(el.dataset.index)); }
      });
    });
  }

  function renderReader(i, animate){
    const p = posts[i];
    readerBody.innerHTML = `
      <div class="entry-meta"><span class="mark" aria-hidden="true"></span>${p.date}</div>
      <h1 class="reader-title">${p.title}</h1>
      <div class="reader-content">
        ${renderContent(p.content)}
      </div>
      <nav class="nav-row">
        <button class="nav-btn prev" ${i === 0 ? 'disabled' : ''}>
          ${i > 0 ? `<span class="nav-label">← previous</span><span class="nav-title">${posts[i-1].title}</span>` : ''}
        </button>
        <button class="nav-btn next" ${i === posts.length - 1 ? 'disabled' : ''}>
          ${i < posts.length - 1 ? `<span class="nav-label">next →</span><span class="nav-title">${posts[i+1].title}</span>` : ''}
        </button>
      </nav>
    `;
    progressEl.textContent = `${i + 1} / ${posts.length}`;

    const prevBtn = readerBody.querySelector('.nav-btn.prev');
    const nextBtn = readerBody.querySelector('.nav-btn.next');
    if(i > 0) prevBtn.addEventListener('click', () => pageTo(i - 1));
    if(i < posts.length - 1) nextBtn.addEventListener('click', () => pageTo(i + 1));

    if(animate){
      readerEl.classList.add('paging');
      requestAnimationFrame(() => {
        setTimeout(() => readerEl.classList.remove('paging'), 400);
      });
    }
    readerBody.scrollTo(0,0);
    readerEl.scrollTo(0,0);
  }

  function openPost(i){
    currentIndex = i;
    renderReader(i, false);
    readerEl.classList.add('open');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function pageTo(i){
    currentIndex = i;
    renderReader(i, true);
  }

  function closeReader(){
    readerEl.classList.remove('open');
    document.body.style.overflow = '';
  }

  closeBtn.addEventListener('click', closeReader);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && readerEl.classList.contains('open')) closeReader();
    if(readerEl.classList.contains('open')){
      if(e.key === 'ArrowRight' && currentIndex < posts.length - 1) pageTo(currentIndex + 1);
      if(e.key === 'ArrowLeft' && currentIndex > 0) pageTo(currentIndex - 1);
    }
  });

  renderList();

  if (SCRIPT_URL) {
    fetch(SCRIPT_URL)
      .then(r => r.json())
      .then(data => {
        if (Array.isArray(data) && data.length) {
          posts.length = 0;
          posts.push(...data);
          renderList();
        }
      })
      .catch(err => console.warn("Couldn't load live posts, showing sample entries instead.", err));
  }
</script>

</body>
</html>
